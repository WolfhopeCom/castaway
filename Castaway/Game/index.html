<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<style>html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}</style>
<title>Castaway: Survival Island</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed first-person view; HUD hugs the edges like a field kit, menus read as pages of a weathered journal */
:root{
  --ink:#0f1311;
  --panel:rgba(15,19,16,.8);
  --solid:#151a16;
  --line:rgba(233,226,207,.15);
  --parch:#ebe4d0;
  --muted:#a9a592;
  --ember:#e8894a;
  --moss:#a3c26e;
  --hp:#d9574c; --food:#d99a4a; --water:#5cb2df; --warm:#e8c45a; --stam:#e4dfcf;
  --f-title:'IM Fell English SC',Georgia,'Times New Roman',serif;
  --f-note:'IM Fell English',Georgia,serif;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--parch);font-family:var(--f-ui)}
#app{position:relative;height:100%;overflow:hidden;background:#1b2530;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
.compass{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 32px));height:30px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.compass .m{position:absolute;top:4px;transform:translateX(-50%);font:700 13px var(--f-cond);letter-spacing:.06em;color:var(--parch);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
.compass .m.minor{color:var(--muted);font-size:10px;top:8px}
.compass .m.tick{width:1px;height:6px;background:rgba(235,228,208,.5);top:14px;padding:0}
.compass .m.poi{color:var(--ember);font-size:11px;top:15px}
.compass .m.unk{color:var(--muted);font-size:11px;top:15px}
.compass::after{content:'';position:absolute;left:50%;top:0;width:2px;height:8px;margin-left:-1px;background:var(--ember)}
.clock{position:absolute;top:12px;left:16px;font:700 15px var(--f-cond);letter-spacing:.05em;text-shadow:0 1px 3px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:1px}
.clock small{font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.goal{position:absolute;top:12px;right:16px;max-width:min(260px,40vw);text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.goal small{display:block;font:600 10px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.goal span{font:italic 15px/1.3 var(--f-note)}
.goal.warn small{color:var(--hp)}
.vitals{position:absolute;left:16px;bottom:16px;display:grid;gap:7px;width:190px}
.vit{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:center}
.vit svg{width:16px;height:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.vit .tr{height:6px;border-radius:3px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(235,228,208,.12);overflow:hidden}
.vit .tr span{display:block;height:100%;border-radius:3px;transition:width .25s}
.vit.low .tr{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px var(--hp),0 0 8px rgba(217,87,76,.6)}}
.cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgba(235,228,208,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:transform .12s}
.cross.on{transform:scale(1.8);background:var(--ember)}
.stam{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:0;transition:opacity .4s}
.stam circle{fill:none;stroke-width:2.5}
.prompt{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;font:600 14px var(--f-ui);text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.prompt .k{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:var(--parch);color:var(--ink);font:700 12px var(--f-cond);letter-spacing:.04em;text-shadow:none}
.prompt .sub{color:var(--muted);font-weight:500}
.hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.hs{width:52px;height:52px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;position:relative;cursor:pointer;padding:0;color:var(--parch)}
.hs svg{width:30px;height:30px}
.hs i{position:absolute;left:5px;top:2px;font:700 10px var(--f-cond);font-style:normal;color:var(--muted)}
.hs.on{border-color:var(--ember);background:rgba(232,137,74,.16);box-shadow:0 0 0 1px var(--ember)}
.hotname{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);font:600 13px var(--f-ui);color:var(--parch);text-shadow:0 1px 3px rgba(0,0,0,.9);transition:opacity .4s}
.feed{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.feed div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:600 13px var(--f-ui);display:flex;gap:6px;align-items:center;animation:feed 3.2s forwards}
.feed svg{width:18px;height:18px}
.feed div.bad{border-color:rgba(217,87,76,.5);color:#f0a59d}
@keyframes feed{0%{opacity:0;transform:translateX(12px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:italic 18px/1.35 var(--f-note);text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.9);max-width:min(520px,calc(100% - 32px));transition:opacity .5s}
.banner{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;transition:opacity .8s;pointer-events:none;width:calc(100% - 32px)}
.banner small{font:600 11px var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--ember)}
.banner h2{font:400 clamp(30px,6vw,52px)/1 var(--f-title);margin:8px 0 6px;text-shadow:0 2px 12px rgba(0,0,0,.7);text-wrap:balance}
.banner p{font:italic 16px var(--f-note);margin:0;color:var(--parch);opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
#hurt{background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.65))}
#lowhp{background:radial-gradient(ellipse at center,transparent 55%,rgba(120,10,10,.55));transition:opacity 1s}
#cold{background:radial-gradient(ellipse at center,transparent 50%,rgba(170,205,235,.45));transition:opacity 2s}
#under{background:rgba(20,70,80,.55);transition:opacity .2s}
#fade{background:#000;transition:opacity 1.2s}
#spy{background:radial-gradient(circle at center, transparent 0, transparent min(34vw,34vh), rgba(0,0,0,.92) calc(min(34vw,34vh) + 2px));transition:opacity .2s}
#introUI{position:absolute;inset:0;z-index:5;pointer-events:none}
#introUI[hidden]{display:none!important}
.skip{pointer-events:auto}
.bars{position:absolute;inset:0;pointer-events:none}
.bars::before,.bars::after{content:'';position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform .8s ease}
.bars::before{top:0}.bars::after{bottom:0}
.bars.off::before{transform:translateY(-100%)}.bars.off::after{transform:translateY(100%)}
.caption{position:absolute;left:50%;bottom:calc(11vh + 18px);transform:translateX(-50%);width:min(640px,calc(100% - 32px));text-align:center;font:italic clamp(16px,2.4vw,22px)/1.4 var(--f-note);color:var(--parch);text-shadow:0 1px 6px rgba(0,0,0,.95);transition:opacity .9s;pointer-events:none}
.skip{position:absolute;right:16px;bottom:calc(11vh - 46px);appearance:none;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--parch);border-radius:6px;padding:7px 12px;font:700 12px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;z-index:2}
.placehint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--ember);border-radius:10px;padding:7px 12px;font:600 13px var(--f-ui);white-space:nowrap}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:16px;box-sizing:border-box}
.ov[hidden]{display:none!important}
.ov.dim{background:rgba(8,10,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-inline:clamp(16px,6vw,72px);padding-block:clamp(24px,8vh,80px);background:linear-gradient(180deg,rgba(8,10,9,.0) 30%,rgba(8,10,9,.78))}
.title h1{font:400 clamp(48px,11vw,118px)/.9 var(--f-title);margin:0;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.5);text-wrap:balance}
.title .subt{font:400 clamp(18px,3vw,30px)/1 var(--f-title);letter-spacing:.42em;text-transform:uppercase;color:var(--ember);margin:10px 0 0 .2em}
.title p{font:italic clamp(16px,2.2vw,21px)/1.4 var(--f-note);color:var(--parch);opacity:.85;max-width:34em;margin:12px 0 26px}
.menu{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mb{appearance:none;border:0;background:none;color:var(--parch);font:400 24px var(--f-title);letter-spacing:.04em;padding:4px 0;cursor:pointer;text-align:left;opacity:.82;display:flex;align-items:center;gap:12px}
.mb::before{content:'';width:0;height:1px;background:var(--ember);transition:width .25s}
.mb:hover,.mb:focus-visible{opacity:1;outline:none}
.mb:hover::before,.mb:focus-visible::before{width:26px}
.mb:disabled{opacity:.3;cursor:default}
.mb.danger{color:#f0a59d}
.loading{font:italic 16px var(--f-note);color:var(--muted)}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:6px;padding:24px 26px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h2{font:400 34px/1 var(--f-title);margin:0 0 4px}
.card .sub{font:italic 15px var(--f-note);color:var(--muted);margin:0 0 18px}
.set{display:grid;grid-template-columns:150px 1fr 48px;gap:10px 14px;align-items:center;margin-bottom:12px}
.set label{font:600 14px var(--f-ui)}
.set output{font:600 13px var(--f-cond);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ember)}
.seg{display:flex;gap:4px;grid-column:2 / 4}
.seg button{flex:1;appearance:none;border:1px solid var(--line);background:transparent;color:var(--parch);border-radius:6px;padding:6px;font:600 13px var(--f-ui);cursor:pointer}
.seg button.on{background:var(--ember);border-color:var(--ember);color:#1e1206}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;align-items:center}
.keys .k{display:inline-block;min-width:20px;text-align:center;padding:2px 6px;border-radius:4px;background:rgba(235,228,208,.12);border:1px solid var(--line);font:700 12px var(--f-cond);letter-spacing:.04em;margin-right:3px}
.row2{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:6px;padding:10px 16px;background:var(--ember);color:#1e1206;font:700 15px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--parch)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ---------- pack ---------- */
.pack{width:min(940px,100%);height:min(640px,100%);display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.ptabs{display:flex;align-items:center;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.ptab{appearance:none;border:0;background:none;color:var(--muted);font:400 21px var(--f-title);padding:8px 14px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptab.on{color:var(--parch);border-bottom-color:var(--ember)}
.ptabs .x{margin-left:auto;appearance:none;border:1px solid var(--line);background:none;color:var(--parch);border-radius:6px;padding:5px 10px;font:700 12px var(--f-cond);letter-spacing:.08em;cursor:pointer;flex:none}
.pbody{flex:1;overflow:auto;padding:18px 20px 22px;min-height:0}
.h3{font:600 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.it{display:grid;grid-template-columns:36px 1fr;gap:2px 10px;align-items:center;background:rgba(235,228,208,.05);border:1px solid transparent;border-radius:6px;padding:8px 10px;text-align:left;color:inherit;min-width:0}
button.it{cursor:pointer;appearance:none}
button.it:hover{border-color:var(--line)}
.it svg{grid-row:span 2;width:34px;height:34px}
.it b{font:600 14px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{font:500 12px var(--f-ui);color:var(--muted)}
.it small em{font-style:normal;color:var(--ember)}
.rec{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:center;padding:12px;border-radius:6px;background:rgba(235,228,208,.05);margin-bottom:8px}
.rec svg{grid-row:span 3;width:40px;height:40px}
.rec b{font:400 21px/1 var(--f-title)}
.rec p{margin:0;font:500 13px var(--f-ui);color:var(--muted);grid-column:2}
.rec .need{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:5px}
.need span{font:600 12px var(--f-ui);padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.need .ok{color:#b9dc8f}.need .no{color:#f0a59d}
.rec .done{font:700 12px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--moss)}
.goals{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:6px}
.goals li{display:flex;gap:10px;align-items:baseline;font:500 15px var(--f-ui)}
.goals li::before{content:'';width:9px;height:9px;border:1.5px solid var(--muted);border-radius:2px;flex:none;transform:translateY(1px)}
.goals li.d{color:var(--muted);text-decoration:line-through}
.goals li.d::before{background:var(--moss);border-color:var(--moss)}
.goals li.c{color:var(--parch)}
.goals li.c::before{border-color:var(--ember)}
.goals li.f{opacity:.45}
.note{border-left:2px solid var(--ember);padding:2px 0 2px 14px;margin-bottom:16px;max-width:60ch}
.note b{font:400 18px var(--f-title);display:block;margin-bottom:3px}
.note p{font:italic 16px/1.5 var(--f-note);margin:0;color:#d9d2bd}
.lm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.lm span{font:600 13px var(--f-ui);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.lm span.y{border-color:var(--ember);color:var(--parch)}
.lm span.n{color:var(--muted)}
.mapwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
#mapc{width:min(520px,100%);aspect-ratio:1;border-radius:4px;border:1px solid var(--line);background:#0b0f0d;max-width:100%}
.legend{display:grid;gap:6px;font:500 13px var(--f-ui);color:var(--muted);min-width:0;flex:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}

/* ---------- touch ---------- */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--bs:1}
#touch{position:absolute;inset:0;pointer-events:none}
#touch[hidden]{display:none!important}
#joyZone{position:absolute;left:0;top:22%;bottom:0;width:44%;pointer-events:auto;touch-action:none}
.joy{position:absolute;left:calc(var(--sl) + 40px);bottom:calc(var(--sb) + 90px);width:128px;height:128px;margin:0;border-radius:50%;background:radial-gradient(circle,rgba(15,19,16,.18),rgba(15,19,16,.42));border:1.5px solid rgba(235,228,208,.22);pointer-events:none;opacity:.55;transition:opacity .2s,border-color .2s,box-shadow .2s}
.joy.act{opacity:1;transition:opacity .08s}
.joy.run{border-color:var(--ember);box-shadow:0 0 0 4px rgba(232,137,74,.25)}
.joy span{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(235,228,208,.42);box-shadow:0 2px 8px rgba(0,0,0,.35);will-change:transform}
.tb{position:absolute;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;appearance:none;border:1.5px solid rgba(235,228,208,.22);background:rgba(15,19,16,.5);color:var(--parch);border-radius:50%;font:700 11px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;display:grid;place-items:center;padding:0;transition:transform .08s,background .15s,opacity .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tb svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.press{transform:scale(.9);background:rgba(232,137,74,.4)}
.tb.on{background:rgba(232,137,74,.45);border-color:var(--ember)}
.tb.big{width:calc(var(--bs)*88px);height:calc(var(--bs)*88px);right:calc(var(--sr) + 26px);bottom:calc(var(--sb) + 92px)}
.tb.big svg{width:40%;height:40%}
.tb.big svg.ring{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);stroke-width:4}
.tb.big svg.ring circle{stroke:var(--ember);stroke-dasharray:289;stroke-dashoffset:289;opacity:.9}
.tb.use{width:calc(var(--bs)*66px);height:calc(var(--bs)*66px);right:calc(var(--sr) + 26px + var(--bs)*100px);bottom:calc(var(--sb) + 150px);opacity:.55}
.tb.use.on{opacity:1;background:rgba(163,194,110,.35);border-color:var(--moss)}
.tb.use span{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(15,19,16,.72);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 13px var(--f-ui);letter-spacing:0;text-transform:none;max-width:42vw;overflow:hidden;text-overflow:ellipsis;display:none}
.tb.use.on span:not(:empty){display:block}
.tb.s{width:calc(var(--bs)*56px);height:calc(var(--bs)*56px)}
#tJump{right:calc(var(--sr) + 30px);bottom:calc(var(--sb) + 92px + var(--bs)*104px)}
#tCrouch{right:calc(var(--sr) + 26px + var(--bs)*104px);bottom:calc(var(--sb) + 70px)}
.ttop{position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 92px);display:flex;gap:10px;pointer-events:none}
.ttop .tb{position:relative;width:46px;height:46px;border-radius:12px}
.ttop .tb[hidden]{display:none}
#rotateOv{display:none;position:fixed;inset:0;z-index:50;background:#0f1311;place-items:center;text-align:center;color:var(--parch)}
#rotateOv div{display:grid;gap:10px;justify-items:center;padding:24px}
#rotateOv svg{width:64px;height:64px;fill:none;stroke:var(--ember);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:rot 2.4s ease-in-out infinite}
#rotateOv b{font:400 24px var(--f-title)} #rotateOv span{font:500 14px var(--f-ui);color:var(--muted)}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch #rotateOv{display:grid}}
body.touch #app{touch-action:none;-webkit-touch-callout:none}
body.touch .vitals{bottom:auto;top:calc(var(--st) + 56px);left:calc(var(--sl) + 16px);width:150px}
body.touch .hotbar{bottom:calc(var(--sb) + 10px)}
body.touch .hs{width:clamp(40px,calc((100vw - 400px)/9),54px);height:clamp(40px,calc((100vw - 400px)/9),54px)}
body.touch .feed{bottom:auto;top:110px}
@media (max-width:560px){.vitals{width:140px}body:not(.touch) .hs{width:44px;height:44px}.goal span{font-size:13px}.set{grid-template-columns:110px 1fr 40px}}
@media (prefers-reduced-motion:reduce){.feed div{animation-duration:.01s;animation-delay:2.5s}.vit.low .tr{animation:none}}
</style>
</head>
<body>


<div id="app">
  <canvas id="c" tabindex="0" aria-label="Castaway: Survival Island game view"></canvas>

  <div id="hud" hidden>
    <div class="compass" id="compass"></div>

<script>
(function(){

const $ = id => document.getElementById(id);
if(typeof THREE==='undefined' || !THREE.BufferGeometryUtils){ $('titleMenu').innerHTML = '<span class="loading">The 3D engine could not load. Check your connection and reload.</span>'; return; }

/* =========================================================
   basics
   ========================================================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };

function ridgeN(x,z,o=4){ let s=0,a=.5,f=1,n=0; for(let i=0;i<o;i++){ s+=a*(1-Math.abs(vnoise(x*f+i*5.1,z*f+i*3.7))); n+=a; a*=.5; f*=2.1; } return s/n; }

const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints>0);
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k))||null; }catch(e){ return null; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

const CFG = Object.assign({autoRes:true, touchSens:1, btnScale:1, aimAssist:true, haptics:true, sens:1, invert:false, bob:.6, fov:75, quality:isTouch?'medium':'high', vol:.8, music:.55}, loadJSON('castaway-settings')||{});
const Q = () => ({low:{grass:3000, flowers:500, shadow:1024, ratio:1, R:34}, medium:{grass:6500, flowers:1100, shadow:2048, ratio:1.5, R:44}, high:{grass:12000, flowers:1800, shadow:4096, ratio:2, R:54}})[CFG.quality];

/* =========================================================
   world shape
   ========================================================= */
const HALF=260, SEG=260, STEP=2*HALF/SEG, BOUND=226;
const RIDGE={x:75,z:-30,r0:32,r1:42,h:38}; RIDGE.ramp=Math.atan2(-RIDGE.z,-RIDGE.x);
const LAKE={x:-80,z:55,r:36};
const PEAK={x:-62,z:-108};
const RIVERS=[
  [[-22,-122],[-12,-96],[-8,-78],[-30,-40],[-58,0],[-74,32]],
  [[-110,64],[-148,82],[-185,96],[-245,108]],

const TOWER={x:40,z:-118};
function coastR(a){ return 192 + 13*Math.sin(a*3+.7) + 8*Math.sin(a*5+2.1) + 4*Math.sin(a*9+.3); }
const caveAng = RIDGE.ramp + PI*0.78;
const POIS=[
  {id:'wreck',  name:'The Wreck',            x:12,  z:coastR(PI/2)-28, r:5,  flat:false, line:'Where the storm threw your boat onto the rocks.'},
  {id:'camp',   name:"Trapper's Camp",       x:18,  z:-62, r:11, flat:true,  line:'Someone lived here, and left in a hurry.'},
  {id:'tower',  name:'Old Watchtower',       x:TOWER.x, z:TOWER.z, r:9, flat:true, line:'A lookout over the whole island and the empty sea.'},
  {id:'stones', name:'The Standing Stones',  x:22,  z:92,  r:12, flat:true,  line:'Seven stones, older than anything else here.'},
  {id:'dock',   name:'Lakeside Dock',        x:0,   z:0,   r:8,  flat:false, line:'Grey planks reaching into still water.'},
  {id:'cave',   name:'Hollow Cave',          x:RIDGE.x+Math.cos(caveAng)*(RIDGE.r1+8), z:RIDGE.z+Math.sin(caveAng)*(RIDGE.r1+8), r:8, flat:true, line:'A hollow under the cliff, lit by mushrooms.'},
  {id:'ruins',  name:'Ashen Ruins',          x:RIDGE.x, z:RIDGE.z, r:15, flat:true, danger:true, line:'Blue fires burn without heat.'},

const POI = Object.fromEntries(POIS.map(p=>[p.id,p]));
function distSeg(px,pz,ax,az,bx,bz){ const dx=bx-ax, dz=bz-az, l=dx*dx+dz*dz; let t=l?((px-ax)*dx+(pz-az)*dz)/l:0; t=clamp(t,0,1); return hyp(px-ax-dx*t, pz-az-dz*t); }

function forestD(x,z){ return fbm(x*.012+40, z*.012-20, 4); }
function terrainRaw(x,z){
  let h = 10 + fbm(x*.0055,z*.0055,5)*13 + fbm(x*.028,z*.028,3)*1.6;
  h += 15*Math.exp(-((x-TOWER.x)**2+(z-TOWER.z)**2)/900);
  const dp = hyp(x-PEAK.x, z-PEAK.z);
  h += 52*Math.exp(-dp*dp/(52*52)) * (.7 + .5*ridgeN(x*.03, z*.03, 4));
  const dr = hyp(x-RIDGE.x, z-RIDGE.z);

    const a = Math.atan2(z-RIDGE.z, x-RIDGE.x), ramp = Math.pow(Math.max(0,Math.cos(angDiff(a,RIDGE.ramp))),10);

}
function coastShape(x,z,h){
  const r = hyp(x,z), R = coastR(Math.atan2(z,x));
  const cap = 1.1 + Math.max(0, R-40-r)*.22 + Math.max(0, R-72-r)*.9 + fbm(x*.03,z*.03,2)*1.2;
  h = lerp(h, Math.min(h, cap), smooth(R-110, R-60, r));
  return lerp(h, -13 + fbm(x*.02,z*.02,2)*3, smooth(R-40, R+28, r));
}
for(const p of POIS) if(p.flat) p.t = coastShape(p.x,p.z,terrainRaw(p.x,p.z));
POI.cave.t = coastShape(0,0,terrainRaw(RIDGE.x+Math.cos(caveAng)*(RIDGE.r1+20), RIDGE.z+Math.sin(caveAng)*(RIDGE.r1+20)));
function terrainH(x,z){
  let h = coastShape(x, z, terrainRaw(x,z));
  for(const p of POIS){ if(!p.flat) continue; const d=hyp(x-p.x,z-p.z), rr=p.r+(p.id==='cave'?2:7); if(d<rr+(p.id==='cave'?6:0)){ h=lerp(h,p.t,smooth(rr+(p.id==='cave'?6:0),p.r,d)); } }

}
/* ---------- waterfalls: one off the mountain into the river's source, one off the Ashen Ridge ---------- */
const FALLS = [];
(function(){
  const nat = (x,z) => coastShape(x,z,terrainRaw(x,z));
  { const S0 = RIVERS[0][0], S1 = RIVERS[0][1], L = hyp(S1[0]-S0[0], S1[1]-S0[1]), dx = (S1[0]-S0[0])/L, dz = (S1[1]-S0[1])/L;
    const lx = S0[0] - dx*2.5, lz = S0[1] - dz*2.5;
    const top = clamp(nat(lx - dx*16, lz - dz*16) - 3, 15, 23);
    FALLS.push({id:'mountain', name:'Thunder Falls', x:lx, z:lz, dx, dz, top, bottom:0, width:5.2, stream:42, pool:null, gorge:true}); }
  { const a = caveAng + .5, dx = Math.cos(a), dz = Math.sin(a);
    const lx = RIDGE.x + dx*(RIDGE.r0+1.5), lz = RIDGE.z + dz*(RIDGE.r0+1.5);
    const top = nat(lx - dx*5, lz - dz*5) - .4, py = nat(lx + dx*14, lz + dz*14);
    FALLS.push({id:'ridge', name:'Veil Falls', x:lx, z:lz, dx, dz, top, bottom:py, width:3.2, stream:18, pool:{x:lx+dx*3.6, z:lz+dz*3.6, r:5.2, y:py}, gorge:false}); }
})();
function fallLocal(f,x,z){ const rx = x-f.x, rz = z-f.z; return {along: -(rx*f.dx + rz*f.dz), lat: rx*(-f.dz) + rz*f.dx}; }
function fallShape(x,z,h){
  for(const f of FALLS){
    if(Math.abs(x-f.x) > f.stream+30 || Math.abs(z-f.z) > f.stream+30) continue;

    if(along >= 0 && along < f.stream+14){

        const bed = smooth(3.2, 1.6, al) * smooth(f.stream+2, f.stream-2, along);

}
function nearFall(x,z,pad){ for(const f of FALLS){ const {along, lat} = fallLocal(f,x,z); if(along > -14 && along < f.stream+4 && Math.abs(lat) < 4+pad) return true; if(f.pool && hyp(x-f.pool.x,z-f.pool.z) < f.pool.r+pad) return true; } return false; }
function freshWaterAt(x,z){ for(const f of FALLS){ const {along, lat} = fallLocal(f,x,z); if(along > -.5 && along < f.stream && Math.abs(lat) < 2.2) return true; if(f.pool && hyp(x-f.pool.x,z-f.pool.z) < f.pool.r-.3) return true; } return false; }
function nearCoast(x,z){ const r = hyp(x,z), R = coastR(Math.atan2(z,x)); return smooth(R-78, R-50, r); }

/* height grid used by rendering and physics */
const N1 = SEG+1, HG = new Float32Array(N1*N1);
function buildHeights(){ for(let j=0;j<N1;j++) for(let i=0;i<N1;i++) HG[j*N1+i] = terrainH(-HALF+i*STEP, -HALF+j*STEP); }
/* ---------- the other islands ---------- */
const ISLES = [
  {id:'ember',   name:'Ember Key',    cx:700,  cz:-140, R:92,  half:132, seed:1.7},
  {id:'lantern', name:'Lantern Isle', cx:-580, cz:-540, R:112, half:152, seed:4.1},
];
const ISLE = Object.fromEntries(ISLES.map(i=>[i.id,i]));
ISLE.ember.spring = {x:ISLE.ember.cx-40, z:ISLE.ember.cz+30, r:5.5};
ISLE.ember.crater = {x:ISLE.ember.cx+5, z:ISLE.ember.cz-4};
ISLE.lantern.light = {x:ISLE.lantern.cx+58, z:ISLE.lantern.cz-44};
POIS.push({id:'ember', name:'Ember Key', x:ISLE.ember.crater.x, z:ISLE.ember.crater.z, r:34, flat:false, line:'An island built by fire. The mountain still breathes.'},
  {id:'springs', name:'The Hot Springs', x:ISLE.ember.spring.x, z:ISLE.ember.spring.z, r:8, flat:false, line:'Warm water steams between black rocks.'},
  {id:'lighthouse', name:'Lantern Lighthouse', x:ISLE.lantern.light.x, z:ISLE.lantern.light.z, r:12, flat:false, line:'Its lamp is dark. Someone could light it again.'});
POIS.forEach(p=>POI[p.id]=p);
function isleR(I, a){ return I.R*(1 + .13*Math.sin(a*3+I.seed) + .07*Math.sin(a*5+I.seed*2.3) + .04*Math.sin(a*9+I.seed)); }
function isleH(I, x, z){
  const lx = x-I.cx, lz = z-I.cz, r = hyp(lx,lz), R = isleR(I, Math.atan2(lz,lx));
  let h;
  if(I.id==='ember'){
    const cone = Math.max(0, 1 - r/(R*.78));
    h = 2.5 + Math.pow(cone,1.35)*64 + fbm(x*.03,z*.03,3)*2.2 + ridgeN(x*.05,z*.05,3)*2.5*cone;
    const cr = hyp(x-I.crater.x, z-I.crater.z); if(cr < 15) h = lerp(h, 44, smooth(15, 8, cr));
    const sp = hyp(x-I.spring.x, z-I.spring.z); if(sp < 14){ const base = 3.4; h = lerp(h, base, smooth(14, 8, sp)); if(sp < I.spring.r) h = lerp(h, base-1.6, smooth(I.spring.r, I.spring.r-2, sp)); else h = lerp(h, base+.3, smooth(I.spring.r+2.5, I.spring.r+.8, sp)*smooth(I.spring.r-.3, I.spring.r+.8, sp)); }

    h = 5 + fbm(x*.012, z*.012, 4)*9 + fbm(x*.04, z*.04, 2)*1.4;
    const L = I.light, hd = hyp(x-L.x, z-L.z); h += Math.max(0, 1 - hd/46)*13;

  h = lerp(h, Math.min(h, cap), smooth(R-95, R-55, r));

}
function buildIsleHeights(){
  for(const I of ISLES){ I.seg = Math.round(I.half*2/2); I.step = I.half*2/I.seg; I.n1 = I.seg+1; I.HG = new Float32Array(I.n1*I.n1);
    for(let j=0;j<I.n1;j++) for(let i=0;i<I.n1;i++) I.HG[j*I.n1+i] = isleH(I, I.cx-I.half+i*I.step, I.cz-I.half+j*I.step); }
}
function gridH(I, x, z){
  const fx = clamp((x-I.cx+I.half)/I.step, 0, I.seg-1e-4), fz = clamp((z-I.cz+I.half)/I.step, 0, I.seg-1e-4);

  return d + (c-d)*(1-u) + (b-d)*(1-v);
}
function isleAt(x,z){ for(const I of ISLES) if(I.HG && Math.abs(x-I.cx) < I.half && Math.abs(z-I.cz) < I.half) return I; return null; }
function isleColor(I, x, z, h, s, out){
  const n = fbm(x*.07, z*.07, 2);
  if(I.id==='ember'){
    if(h < -.3) out.setHex(0x242120); else if(h < 2.4) out.setHex(0x34302d).offsetHSL(0,0,n*.04);
    else { out.setHex(0x4a6a32).lerp(new THREE.Color(0x3a3532), smooth(6, 16, h) + smooth(.4,.9,s)); if(h > 30) out.lerp(new THREE.Color(0x5a2a1c), smooth(36,44,h)*.6); }
    const sp = hyp(x-I.spring.x, z-I.spring.z); if(sp < 9) out.lerp(new THREE.Color(0xc9c2a8), smooth(9, 6, sp)*.8);
  } else {

const TREE_T = {palm:{hp:3, wood:3, r:.3}, pine:{hp:4, wood:4, r:.38}, oak:{hp:5, wood:6, r:.55}, birch:{hp:3, wood:3, r:.3}, dead:{hp:2, wood:2, r:.35}};

const ck = (ix,iz) => ix*4096+iz;

    const sd = skyU.uSunDir.value, az = Math.atan2(sd.x, sd.z), el = Math.max(-.2, Math.asin(clamp(sd.y,-1,1)));

      o.yawC = o.yawC === undefined ? yaw : o.yawC + angDiff(yaw, o.yawC)*.08; o.pitchC = o.pitchC === undefined ? pitch : lerp(o.pitchC, pitch, .08);
      const sway = Math.sin(clockT*1.4 + o.ph)*.04*WIND.uWind.value;

function streamFlowers(px,pz){
  const q = Q(), R = q.R*.92, cell = Math.sqrt(PI*R*R/(q.flowers*2.2)), counts = {};
  for(const s of FLORA.streams){ counts[s.k] = 0; }
  const by = Object.fromEntries(FLORA.streams.map(s=>[s.k, s.m]));
  for(let i=Math.floor((px-R)/cell); i<=Math.ceil((px+R)/cell); i++) for(let j=Math.floor((pz-R)/cell); j<=Math.ceil((pz+R)/cell); j++){
    const h1 = hash2(i*11+5,j*13+1), h2 = hash2(i*7-3,j*17+4), h3 = hash2(i+3,j+8), x = (i+h1)*cell, z = (j+h2)*cell;
    if((x-px)**2+(z-pz)**2 > R*R) continue;
    const h = ground(x,z); if(h < 1.5 || h > 34) continue; const s = slopeAt(x,z); if(s > .42 || inRidge(x,z) || nearFall(x,z,0)) continue;
    const fd = forestD(x,z), drift = fbm(x*.028+3, z*.028-8, 3), mix2 = fbm(x*.06-2, z*.06+5, 2);
    let k = null, dens;
    if(fd > .12){ dens = .12; k = 'butter'; }
    else { dens = smooth(.1,-.25,fd)*(.35 + Math.abs(drift)*1.4);
      if(drift > .1) k = mix2 > .12 ? 'lupK' : mix2 < -.12 ? 'lupB' : 'lupP';
      else if(drift < -.14) k = 'poppy';
      else k = h3 > .6 ? 'butter' : 'daisy'; }
    if(h3 > dens*SEASON.bloom) continue;
    const m = by[k]; if(counts[k] >= m.instanceMatrix.count) continue;
    const sc = (.75 + h2*.55) * (k.startsWith('lup') ? 1 + mix2*.3 : 1);
    D.position.set(x, h-.02, z); D.rotation.set((h1-.5)*.15, h1*TAU, (h2-.5)*.15); D.scale.setScalar(sc); D.updateMatrix(); m.setMatrixAt(counts[k]++, D.matrix);
  }
  for(const st of FLORA.streams){ st.m.count = counts[st.k]; st.m.instanceMatrix.needsUpdate = true; }
}

function bugTarget(b){
  for(let t=0;t<14;t++){ const a = Math.random()*TAU, d = 4 + Math.random()*22, x = P.x + Math.cos(a)*d, z = P.z + Math.sin(a)*d, h = ground(x,z);
    if(b.dragon){ const wet = h < .2 && h > -3 && hyp(x,z) < 150; if(wet || freshWaterAt(x,z)){ b.tx = x; b.tz = z; b.ty = Math.max(0, h) + .5 + Math.random()*1.2; return true; } }

}
function updateBugs(dt){

  BUGS.list.forEach((b,i)=>{
    const far = hyp(b.x-P.x, b.z-P.z) > 34;
    if((far || b.y < -50) && day > .3){ if(bugTarget(b)){ b.x = b.tx + (Math.random()-.5)*3; b.z = b.tz + (Math.random()-.5)*3; b.y = b.ty; } }
    b.timer -= dt; if(b.timer <= 0){ b.timer = b.dragon ? .6 + Math.random()*1.4 : 2 + Math.random()*4; bugTarget(b); }

    const sp = b.dragon ? (d > .3 ? b.sp : 0) : b.sp;

    const flap = b.dragon ? Math.sin(clockT*60+b.ph)*.35 : Math.sin(clockT*16+b.ph)*.95 + .3;
    const sc = show ? (b.dragon? 1.1 : .9) : 1e-4, y = show ? b.y : -200;

    D.rotation.set(0, b.yaw, flap, 'YXZ'); D.updateMatrix(); BUGS.wl.setMatrixAt(i, b.dragon? hideM : D.matrix);
    D.rotation.set(0, b.yaw+PI, -flap, 'YXZ'); D.position.set(b.x, y, b.z); D.updateMatrix(); BUGS.wr.setMatrixAt(i, b.dragon? hideM : D.matrix);
    D.rotation.order = 'XYZ';
    if(b.dragon){ const di = (i - (BUGS.list.length-12))*2; D.position.set(b.x,y,b.z); D.rotation.set(0,b.yaw,flap,'YXZ'); D.updateMatrix(); BUGS.dl.setMatrixAt(di, D.matrix); D.rotation.set(0,b.yaw+PI,-flap,'YXZ'); D.updateMatrix(); BUGS.dl.setMatrixAt(di+1, D.matrix); D.rotation.order='XYZ'; }

  const q = Q(), R = q.R, max = q.grass, c = Math.sqrt(PI*R*R/max)*1.05, col = new THREE.Color();
  let n=0;

          if(rz) col.setRGB(.85,.75,.6); else if(h<2.2) col.setRGB(1,.95,.75); else col.setRGB(.8+h2*.25, .85+h1*.2, .75+h3*.15);
          cell = {m:D.matrix.clone(), r:col.r, g:col.g, b:col.b}; } }

const YEAR = 12;

const SEASON = {snow:0, autumn:0, bloom:1};
const TREEFIRES = [];
function updateSeason(dt){
  const se = seasonOf(dayOf(S.clock)).id, k = Math.min(1, dt/40);
  SEASON.snow = lerp(SEASON.snow, se==='winter' ? 1 : 0, se==='spring' ? k*.6 : k);
  SEASON.autumn = lerp(SEASON.autumn, se==='autumn' ? 1 : se==='winter' ? .5 : 0, k);
  SEASON.bloom = lerp(SEASON.bloom, se==='spring' ? 1.35 : se==='summer' ? 1 : se==='autumn' ? .35 : 0, k);
  SEASON_U.uSnow.value = SEASON.snow; SEASON_U.uAutumn.value = SEASON.autumn;
}
function strikeLightning(){
  W.flash = 1; AU.thunder(1.6);
  let tree = null;
  for(let k=0;k<80;k++){ const t = trees[Math.floor(Math.random()*trees.length)]; if(!t || !t.alive || t.burning) continue; const d = hyp(t.x-P.x, t.z-P.z); if(d > 22 && d < 95){ tree = t; break; } }
  if(!tree || Math.random() < .35) return;
  const top = new THREE.Vector3(tree.x, tree.y + 6*tree.s, tree.z), g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({color:lin(0xdfe8ff), transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false});
  let p = new THREE.Vector3(top.x + (Math.random()-.5)*20, top.y + 120, top.z + (Math.random()-.5)*20);
  for(let i=0;i<14;i++){ const t = (i+1)/14, q = new THREE.Vector3(lerp(p.x, top.x, .25) + (Math.random()-.5)*6*(1-t), lerp(p.y, top.y, t), lerp(p.z, top.z, .25) + (Math.random()-.5)*6*(1-t)); if(i===13) q.copy(top);
    const len = p.distanceTo(q), seg = new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,len,4), mat); seg.position.copy(p).add(q).multiplyScalar(.5); seg.lookAt(q); seg.rotateX(PI/2); g.add(seg); p = q; }
  scene.add(g); setTimeout(()=>{ scene.remove(g); g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }, 260);
  tree.burning = true; const fire = fireMesh(); fire.scale.setScalar(2.4); fire.position.copy(top).y -= 1.5; scene.add(fire);
  TREEFIRES.push({tree, fire, t:0});

  setTimeout(()=>{ if(hyp(tree.x-P.x, tree.z-P.z) < 120) toast('Lightning! A tree is burning.'); }, 400);
}
function updateTreeFires(dt){
  for(let i=TREEFIRES.length-1;i>=0;i--){ const F = TREEFIRES[i]; F.t += dt;
    F.fire.userData.fl.scale.set(1, 1+Math.sin(clockT*9+i)*.2, 1); F.fire.userData.fl.rotation.y += dt*2; F.fire.userData.coal.material.emissiveIntensity = 1.6;
    if(Math.random() < dt*6) burst(F.fire.position.clone().add(new THREE.Vector3((Math.random()-.5)*2, 1.5, (Math.random()-.5)*2)), Math.random()<.5 ? 0xffa040 : 0x444040, 3, 2.2);
    if(F.t > 45){ const t = F.tree; t.alive = false; t.burning = false; if(t.col) t.col.on = false; setTree(t,false); S.felled[t.id] = dayOf(S.clock); scene.remove(F.fire); TREEFIRES.splice(i,1); burst(new THREE.Vector3(t.x, t.y+1, t.z), 0x3a3634, 40, 4); } }
}

function pieceOk(type, sp){

function rebuildBuildMaps(){ FLOORS.clear(); ROOFS.clear(); for(const s of S.structs){ if(s.type==='floor') FLOORS.set(cellKey(s.x,s.z), s.y); if(s.type==='roof') ROOFS.set(cellKey(s.x,s.z), s.y); } }

const CROPS = {

  seeds:{n:'Sunpetals', item:'seeds', give:'seeds', yield:6},
  starbloom:{n:'Starbloom', item:'starbloom', give:'starbloom', yield:3},

function updateGardenVisual(so){
  const s = so.s, crops = so.g.userData.crops; if(!crops) return;
  const p = cropProgress(s), stage = s.crop ? Math.min(4, Math.floor(p*4)) : -1;
  if(crops.userData.stage === stage && crops.userData.type === (s.crop && s.crop.type)) return;
  crops.userData.stage = stage; crops.userData.type = s.crop && s.crop.type;
  while(crops.children.length) crops.remove(crops.children[0]);
  if(!s.crop) return;
  const geos = cropGeo(s.crop.type), sc = .25 + p*.75;
  const mats = [VEG.bushMat || STD(), STD({roughness:.7}), FLORA.petalMat || STD()];

    geos.forEach((gg,i)=>{ const m = new THREE.Mesh(gg, s.crop.type==='starbloom' && i===1 ? FLORA.petalMat : s.crop.type==='berries' && i===0 ? VEG.bushMat : STD({roughness:.75}));
      m.castShadow = true; m.position.set(x, .17, z); const k = s.crop.type==='seeds' ? sc*.55 : s.crop.type==='berries' ? sc*.55 : sc;
      m.scale.setScalar(k); if(s.crop.type==='seeds' && i===1){ m.position.y = .17 + 1.52*k; m.rotation.x = -.4; }
      if(s.crop.type==='berries' && i===1) m.visible = p >= 1; crops.add(m); }); }
}
function updateBuildings(dt){

    if(s.type==='door' && so.g.userData.pivot){ const p = so.g.userData.pivot; p.rotation.y = lerp(p.rotation.y, s.open ? 1.7 : 0, Math.min(1, dt*6)); }

/* =========================================================
   a pet fox
   ========================================================= */
const TREATS = ['fish','cookedfish','meat','cooked'];

const PET = {obj:null, x:0, z:0, y:0, rot:0, speed:0, phase:0, state:'follow', digT:120, growlT:0, biteT:0, idleT:0, sit:0,

function spawnPet(x,z){
  if(PET.obj) scene.remove(PET.obj.g);
  const m = quad(SPECS.fox); m.g.scale.setScalar(1.05);
  const collar = meshOf(new THREE.TorusGeometry(.075,.02,6,16), M(0xb03a2e), 0,0,0); collar.position.copy(m.nDir).multiplyScalar(.06); collar.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), m.nDir); m.neck.add(collar);

function feedFox(a){
  const k = TREATS.find(q=>inv(q)); if(!k) return;
  addInv(k,-1); a.trust = (a.trust||0) + 1; a.calm = 30; a.state = 'idle'; P.gather = 0; AU.yip(a.x,a.z);
  burst(new THREE.Vector3(a.x, a.y+.6, a.z), 0xff7aa8, 12, 1.6);
  if(a.trust >= 3){ const x = a.x, z = a.z; removeAnimal(a); S.pet = {name:'Pip', stay:false, x, z}; spawnPet(x,z); AU.motif();
    banner('A new friend', 'Pip', 'The fox has decided you are family. Pip will follow you and warn you about wolves.', 6200); save(); }
  else toast(a.trust===1 ? 'The fox sniffs the food, then eats it. It stays put.' : 'The fox edges closer. One more should do it.');
}
function updatePet(dt){
  if(!S || !S.pet || !PET.obj) return;
  const m = PET.obj, pet = S.pet;
  let tx = P.x, tz = P.z, want = 0, mode2 = 'follow';
  const h = hourOf(S.clock), night = isNight(h);
  // passenger on the raft
  if(P.raft){ const r = P.raft, fx = Math.sin(r.ry), fz = Math.cos(r.ry); PET.x = r.x + fx*1.1; PET.z = r.z + fz*1.1; PET.y = waterLevelAt(r.x, r.z) + .36; PET.rot = r.ry; mode2 = 'sit';
    m.g.position.set(PET.x, PET.y, PET.z); m.g.rotation.y = PET.rot; poseSit(m, 1, dt); return; }
  if(pet.stay){ tx = pet.x; tz = pet.z; }
  const dx = tx-PET.x, dz = tz-PET.z, d = hyp(dx,dz);
  if(!pet.stay && d > 45){ PET.place(P.x - Math.sin(-P.yaw)*2, P.z + Math.cos(P.yaw)*2); return; }
  // wolves
  let wolf = null, wd = 1e9;
  if(!P.inCave){ for(const a of animals){ if(a.type!=='wolf' || a.dead) continue; const dd = hyp(a.x-PET.x, a.z-PET.z); if(dd < wd){ wd = dd; wolf = a; } } }
  PET.growlT -= dt; PET.biteT -= dt;
  if(wolf && wd < 34 && PET.growlT <= 0){ PET.growlT = 22; AU.petGrowl(PET.x, PET.z); const ang = Math.atan2(wolf.x-P.x, -(wolf.z-P.z)); const dirs = ['north','north-east','east','south-east','south','south-west','west','north-west']; toast(pet.name+' growls toward the '+dirs[((Math.round(ang/(PI/4))%8)+8)%8]+'. Wolves.'); }
  if(wolf && wd < 14 && hyp(wolf.x-P.x, wolf.z-P.z) < 16 && !pet.stay){ tx = wolf.x; tz = wolf.z; mode2 = 'fight';
    if(wd < 1.7 && PET.biteT <= 0){ PET.biteT = 1.1; damageAnimal(wolf, 7); AU.yip(PET.x,PET.z); } }
  const ddx = tx-PET.x, ddz = tz-PET.z, dist = hyp(ddx,ddz);

  else if(pet.stay) want = dist > 1 ? 3 : 0;

function updateSurvival(dt){
  const st = S.stats, h = hourOf(S.clock), night = isNight(h);
  const exert = P.sprint && P.speedNow>3 ? 1.6 : 1;
  st.food = Math.max(0, st.food - .095*dt*exert);
  st.water = Math.max(0, st.water - .14*dt*exert*(ENV.day>.6 && W.cloud<.5 ? 1.15 : 1));
  // warmth
  const fireD = S.structs.reduce((m,s)=> s.type==='campfire' && s.fuel>0 ? Math.min(m, hyp(s.x-P.x,s.z-P.z)) : m, 1e9);
  const treeFire = TREEFIRES.some(F=>hyp(F.tree.x-P.x, F.tree.z-P.z) < 7);
  const nearFire = fireD < 6.5 || treeFire, roofed = underRoof(P.x,P.z), shelter = roofed || S.structs.some(s=>s.type==='leanto' && hyp(s.x-P.x,s.z-P.z)<3), inCave = P.inCave || hyp(POI.cave.x-P.x, POI.cave.z-P.z)<6.5;
  const spring = ISLE.ember.spring, inSpring = !P.inCave && hyp(spring.x-P.x, spring.z-P.z) < spring.r+2;
  const se = seasonOf(dayOf(S.clock)).id;
  let cold = 0;
  if(night) cold += .5; else if(h>=18.5 || h<7) cold += .2;
  cold += W.rain*.3 + W.snow*.25 + (inRidge(P.x,P.z)? .22 : 0) + clamp((P.y-38)/30,0,1)*.35 + (se==='winter' ? .38 : se==='autumn' ? .08 : 0);
  if(P.inCave) cold = 0;
  cold *= 1 + S.wet*.7;
  if(S.gear.cloak) cold *= .5; if(S.gear.charm) cold *= .75; if(shelter || inCave) cold *= .45;
  if(curTool()==='torch') cold = Math.max(0, cold - .08);
  if(inSpring){ st.warmth = Math.min(100, st.warmth + 6*dt); st.health = Math.min(100, st.health + .9*dt); S.wet = 1; if(!S.flags.spring){ S.flags.spring = true; toast('The water is hot. Your aches melt away.'); } }
  else if(nearFire) st.warmth = Math.min(100, st.warmth + (treeFire ? 4 : (7 - fireD*.6))*dt);
  else if(cold > .12) st.warmth = Math.max(0, st.warmth - cold*dt);
  else st.warmth = Math.min(100, st.warmth + 1.2*dt);
  // wetness
  if(inSpring){} else if((W.rain>.3 || W.snow>.5) && !shelter && !inCave && !P.raft) S.wet = Math.min(1, S.wet + Math.max(W.rain, W.snow*.4)*.04*dt); else if(P.raft && W.rain>.3) S.wet = Math.min(1, S.wet + W.rain*.04*dt); else S.wet = Math.max(0, S.wet - (nearFire? .2 : ENV.day>.5? .025 : .01)*dt);
  // health
  let dmg = 0; if(st.food<=0) dmg += .45; if(st.water<=0) dmg += .65; if(st.warmth<=0) dmg += .6;
  if(dmg) hurt(dmg*dt, st.water<=0?'thirst':st.food<=0?'hunger':'cold', true);
  else if(st.food>45 && st.water>45 && st.warmth>35) st.health = Math.min(100, st.health + .14*dt);
  // fires burn down
  S.structs.forEach(s=>{ if(s.type==='campfire' && s.fuel>0){ s.fuel = Math.max(0, s.fuel - dt*(1+W.rain*.6)); } });
  ENV.fireNear = clamp(1 - fireD/14, 0, 1);
}

function onNewDay(day){
  if(seasonOf(day) !== seasonOf(day-1)){ const se = seasonOf(day); setTimeout(()=>banner('Season', se.name, se.line, 5200), 4200); }
  if(S.flags.beacon && S.flags.beaconNight && !S.flags.rescued){ setTimeout(()=>{ if(mode==='play') startRescue(); }, 2500); }
  spawnBottle(); if(Math.random()<.5) spawnBottle();
  const far = (x,z) => hyp(x-P.x,z-P.z) > 45;
  for(const k in S.taken){ if(k[0]==='c' && k[1]==='p' && day - S.taken[k] >= 1) delete S.taken[k]; }
  const winter = seasonOf(day).id==='winter';
  for(const o of picks){ const d = S.taken[o.id]; if(d===undefined) continue; if(winter && (o.kind==='bush' || o.kind==='starbloom' || o.kind==='sunpetal')) continue; const need = o.kind==='mushroom'||o.kind==='redcap'? 2 : 1; if(day-d>=need && far(o.x,o.z)){ delete S.taken[o.id]; if(o.kind==='bush') setBerries(o,true); else { o.alive = true; setTree(o,true); } } }
  for(const o of rocks){ const d = S.mined[o.id]; if(d===undefined) continue; if(day-d >= (o.kind==='iron'?2:5) && far(o.x,o.z)){ delete S.mined[o.id]; o.alive = true; o.hp = o.kind==='iron'?5:4; o.col.on = true; setTree(o,true); } }
  for(const o of trees){ const d = S.felled[o.id]; if(d===undefined) continue; if(day-d >= 4 && far(o.x,o.z)){ delete S.felled[o.id]; o.alive = true; o.hp = TREE_T[o.t].hp; o.col.on = true; setTree(o,true); } }
}
function applySaveToWorld(){
  for(const o of picks){ if(S.taken[o.id]!==undefined){ if(o.kind==='bush') setBerries(o,false); else { o.alive=false; setTree(o,false); } } }
  for(const o of rocks){ if(S.mined[o.id]!==undefined){ o.alive=false; o.col.on=false; setTree(o,false); } }
  for(const o of trees){ if(S.felled[o.id]!==undefined){ o.alive=false; o.col.on=false; setTree(o,false); } }

  if(!S.structs.some(s=>s.poi)) S.structs.unshift({type:'campfire', x:S_POI_FIRE.x, z:S_POI_FIRE.z, ry:0, fuel:0, poi:true});

}

function currentGoal(){

  if(st.food<20) return ['Hunger gnaws. Eat something from your pack (Tab).', true];
  if(st.warmth<25) return ['You are freezing. Get close to a fire.', true];
  if(st.health<25) return ['You are badly hurt. Rest, eat, or bind your wounds.', true];
  if(h>=17.5 && h<20 && !S.structs.some(s=>s.type==='campfire' && s.fuel>0)) return ['Night is coming. Get a fire burning.', true];

/* =========================================================
   opening: the storm and the wreck
   ========================================================= */
const INTRO = {t:0, path:[], cum:[], len:0, boat:null, cues:{}, switched:false, impact:8.7, wake0:11.6, end:16.2, cam:new THREE.Vector3(), look:new THREE.Vector3(), side:null};
function buildIntroPath(){
  // the boat is driven in from the open sea toward the rocks below the beach
  const w = POI.wreck, ix = w.inx, iz = w.inz, tx = -iz, tz = ix;
  const end = [w.x - ix*.8, w.z - iz*.8];
  const start = [w.x - ix*95 + tx*30, w.z - iz*95 + tz*30], ctrl = [w.x - ix*40 - tx*12, w.z - iz*40 - tz*12];
  const path = [];

function pathAt(d){

}
function startIntro(){

  INTRO.boat.visible = true; if(wreckGroup) wreckGroup.visible = false;
  for(const id of ['wreck','barrel']) if(crates[id]) crates[id].visible = false;
  INTRO.t = 0; INTRO.cues = {}; INTRO.switched = false; INTRO.yaw = 0; const p0 = pathAt(0); INTRO.look.set(p0.x, 2, p0.z);
  // pick the higher bank for the opening wide shot
  W.cloud = .97; W.rain = 1; W.fog = .45; W.wind = 1.9;
  mode = 'intro'; $('hud').hidden = true; $('touch').hidden = true; $('introUI').hidden = false;
  $('fade').style.transition = 'none'; $('fade').style.opacity = 1;
  requestAnimationFrame(()=>{ $('bars').classList.remove('off'); });
  AU.init();
}
function caption(text){ const c = $('caption'); if(!text){ c.style.opacity = 0; return; } c.style.opacity = 0; setTimeout(()=>{ c.textContent = text; c.style.opacity = 1; }, 350); }
function cue(name, at, fn){ if(INTRO.t >= at && !INTRO.cues[name]){ INTRO.cues[name] = true; fn(); } }
function switchToWreck(){

  INTRO.boat.visible = false; if(wreckGroup) wreckGroup.visible = true;
  for(const id of ['wreck','barrel']) if(crates[id]) crates[id].visible = true;
  spawnPlayer(); P.eye = .35; W.rain = .85; W.wind = 1.3; W.fog = .4;
}
function skipIntro(){ if(mode!=='intro') return; switchToWreck(); if(INTRO.t < INTRO.end-1.6){ INTRO.t = INTRO.end-1.6; INTRO.cues = Object.assign(INTRO.cues, {c1:1,c2:1,c3:1,c4:1,t1:1,t2:1,t3:1,hit:1,dark:1,beat:1,beat2:1,wake:1}); caption(''); } }
function updateIntro(dt){
